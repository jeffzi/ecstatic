name: CI

on:
  push:
    branches: [main, fix-ci/**, plan/**, "v[0-9]*"]
    paths-ignore:
      - "**.md"
      - LICENSE
      - .fallowrc.json
      - .gitignore
  pull_request:
    branches: [main]
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  ci:
    name: Build, test and check
    permissions:
      contents: read
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "lts/*"
          cache: "npm"

      - name: Setup Go
        id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: optimizer/go.mod
          cache: false

      - name: Install dependencies
        run: npm ci

      - name: Locate Go caches
        id: go-env
        shell: bash
        run: |
          echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          echo "modules=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"

      # setup-go keys its cache on go.sum alone, so it is saved once and never refreshed. Keying
      # on the Go sources saves a new entry whenever they change, and restore-keys starts each
      # miss from the latest entry instead of a cold build. Each job keeps its own entry: they
      # compile with different flags. The npm scripts and hooks build into
      # node_modules/.cache/go-build, so this step must stay after npm ci, which deletes
      # node_modules; plain go commands (installing actionlint, the gotidy hook) still build into
      # go env GOCACHE.
      - name: Cache Go builds
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            node_modules/.cache/go-build
            ${{ steps.go-env.outputs.build }}
            ${{ steps.go-env.outputs.modules }}
          key:
            go-${{ github.job }}-${{ runner.os }}-${{ steps.setup-go.outputs.go-version }}-${{
            hashFiles('package-lock.json', 'optimizer/**/go.sum') }}-${{
            hashFiles('optimizer/**/*.go') }}
          restore-keys: |
            go-${{ github.job }}-${{ runner.os }}-${{ steps.setup-go.outputs.go-version }}-

      # ttsc builds the Go optimizer into this cache; a rebuild is needed only when the optimizer
      # sources or the ttsc release change.
      - name: Cache ttsc plugin builds
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.cache/ttsc
          key:
            ttsc-${{ runner.os }}-${{ hashFiles('node_modules/ttsc/package.json') }}-${{
            hashFiles('optimizer/**') }}

      - name: Install workflow linters
        if: runner.os == 'Linux'
        shell: bash
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          pipx install zizmor==1.29.0
          echo "$(python3 -m site --user-base)/bin" >> "$GITHUB_PATH"

      - name: Build
        run: npm run build

      # Tests first: check's fallow health step reads coverage/, which only
      # a test run produces. The Go tests run in the go job, alongside this one.
      - name: Test
        run: npm run test:vitest

      - name: Check
        if: runner.os == 'Linux'
        run: npm run check && git diff --exit-code

  go:
    name: Go tests
    permissions:
      contents: read
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "lts/*"
          cache: "npm"

      - name: Setup Go
        id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: optimizer/go.mod
          cache: false

      - name: Install dependencies
        run: npm ci

      - name: Locate Go caches
        id: go-env
        shell: bash
        run: |
          echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          echo "modules=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"

      # setup-go keys its cache on go.sum alone, so it is saved once and never refreshed. Keying
      # on the Go sources saves a new entry whenever they change, and restore-keys starts each
      # miss from the latest entry instead of a cold build. Each job keeps its own entry: they
      # compile with different flags. The npm scripts and hooks build into
      # node_modules/.cache/go-build, so this step must stay after npm ci, which deletes
      # node_modules; plain go commands (installing actionlint, the gotidy hook) still build into
      # go env GOCACHE.
      - name: Cache Go builds
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            node_modules/.cache/go-build
            ${{ steps.go-env.outputs.build }}
            ${{ steps.go-env.outputs.modules }}
          key:
            go-${{ github.job }}-${{ runner.os }}-${{ steps.setup-go.outputs.go-version }}-${{
            hashFiles('package-lock.json', 'optimizer/**/go.sum') }}-${{
            hashFiles('optimizer/**/*.go') }}
          restore-keys: |
            go-${{ github.job }}-${{ runner.os }}-${{ steps.setup-go.outputs.go-version }}-

      - name: Test
        run: npm run test:go
