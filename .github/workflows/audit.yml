name: Security audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    name: Known vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "lts/*"
          cache: "npm"
      # Dev dependencies are left out: the audit gates what a consumer installs.
      - name: Audit runtime dependencies for known vulnerabilities
        run: npm audit --omit=dev
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: optimizer/go.mod
          cache-dependency-path: optimizer/**/go.sum
      # go.work resolves the ttsc shim modules from node_modules.
      - name: Install dependencies
        run: npm ci
      - name: Audit the Go optimizer for known vulnerabilities
        run: go -C optimizer tool govulncheck ./...
