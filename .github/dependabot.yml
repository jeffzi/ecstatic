version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "build(deps)"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"

  - package-ecosystem: "gomod"
    directory: "/optimizer/tools"
    schedule:
      interval: "weekly"
      day: monday
    cooldown:
      default-days: 7
    commit-message:
      prefix: "build(deps)"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: monday
    cooldown:
      default-days: 7
    commit-message:
      prefix: "build(deps)"
