# yaml-language-server: $schema=https://json.schemastore.org/lefthook.json
glob_matcher: doublestar

pre-commit:
  files: git diff --cached --name-only --diff-filter=ACMR
  commands: &checks
    lint:
      priority: 1
      glob: "**/*.{ts,tsx,mts,cts,js}"
      run: npx oxlint --fix {files}
      stage_fixed: true
    md:
      priority: 1
      glob: "**/*.md"
      run: npx markdownlint-cli2 --fix {files}
      stage_fixed: true
    gofmt:
      priority: 1
      root: optimizer/
      glob: "optimizer/**/*.go"
      # The formatters .golangci.yml enables (gofumpt, goimports), so golint never reports a
      # formatting finding this hook would have fixed.
      run: npx tsx ../scripts/go.ts tool golangci-lint fmt {files}
      stage_fixed: true
    fmt:
      priority: 2
      glob: "**/*.{ts,tsx,mts,cts,js,json,jsonc,md,yml,yaml}"
      # oxfmt errors when every staged file is ignored; oxlint exits 0 and needs no guard
      run: npx oxfmt --no-error-on-unmatched-pattern {files}
      stage_fixed: true
    type:
      priority: 3
      glob: "**/*.{ts,tsx,mts,cts}"
      run: npx tsc -p tsconfig.json --noEmit && npx tsc -p tests/tsconfig.json --noEmit
    typelint:
      priority: 3
      glob: "**/*.{ts,tsx,mts,cts}"
      run: npx oxlint --type-aware
    govet:
      priority: 3
      glob: "optimizer/**/*.go"
      run: npx tsx scripts/go.ts -C optimizer vet ./...
    golint:
      priority: 3
      glob: "optimizer/**/*.go"
      # golangci-lint is pinned in optimizer/tools/go.mod, which go.work brings into scope. The
      # second pass applies the larger file-length cap to _test.go files.
      run: npm run -s lint:go
    gotidy:
      priority: 3
      glob: "optimizer/tools/go.{mod,sum}"
      # Only the tools module: the optimizer module requires ttsc shim modules that resolve
      # through go.work alone, so tidy cannot run there.
      run: go -C optimizer/tools mod tidy -diff
    spelling:
      priority: 3
      glob:
        - "**/*.{ts,tsx,mts,cts,md,go}"
        - "**/go.{mod,work}"
      run: npx cspell --no-progress --no-summary --no-must-find-files {files}
    actions:
      priority: 3
      glob: ".github/workflows/*.yml"
      run: actionlint {files} && zizmor --persona=pedantic {files}

check:
  files: git ls-files --cached --others --exclude-standard --full-name
  commands:
    <<: *checks
    quality:
      priority: 3
      glob: "**/*.{ts,tsx,mts,cts,js,json}"
      # check-coverage-fresh.ts must run before fallow: fallow scores CRAP against
      # coverage/coverage-final.json, so a src/ edit made after the last test run
      # would be scored against stale line maps.
      run: npx tsx scripts/check-coverage-fresh.ts && npx fallow --fail-on-issues --quiet
    package:
      priority: 4
      run: npm run build && npx publint --strict && npx attw --pack . --profile esm-only

commit-msg:
  commands:
    commitlint:
      run: npx commitlint --edit {1}

pre-push:
  commands:
    # Tests first: check's fallow health step reads coverage/, which only a
    # test run produces. On a fresh clone the first push would otherwise fail.
    test:
      priority: 1
      run: npm test
    check:
      priority: 2
      run: npm run check
